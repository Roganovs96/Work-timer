<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рабочий день</title>
<link rel="stylesheet" href="core/style.css">
</head>
<body>
<div class="app">
  <div class="cards">
    <div class="card">
      <div class="label">Осталось</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="sub" id="timerSub"></div>
    </div>
    <div class="card">
      <div class="label">Прошло</div>
      <div class="percent" id="percent">0%</div>
      <div class="sub" id="percentSub"></div>
    </div>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="scenes" id="scenes"></div>
  </div>
  <div class="nav">
    <button class="arrow" id="prev" aria-label="Предыдущая">‹</button>
    <div class="dots" id="dots"></div>
    <span id="sceneName"></span>
    <button class="arrow" id="next" aria-label="Следующая">›</button>
  </div>

  <div class="panel">
    <div class="field">
      Начало <input type="time" id="start" value="10:00">
      Конец <input type="time" id="end" value="19:00">
    </div>
    <button class="btn primary" id="leave" style="margin-left: auto">Уйти пораньше 🏃</button>
  </div>
</div>

<script src="core/host.js"></script>
<script src="scenes/list.js"></script>
<script src="core/app.js"></script>
</body>
</html>
