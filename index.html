<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рабочий день</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --text: #e8eaf0; --muted: #8a90a0;
    --track: #262a34; --accent: #4f9cff; --done: #3ddc97; --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    padding: 16px;
  }
  .app { height: calc(100vh - 32px); height: calc(100dvh - 32px); display: flex; flex-direction: column; gap: 12px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid-wrap { flex: 1; min-height: 160px; position: relative; }
  /* Лента инфографик: листается свайпом, каждая сцена на всю ширину */
  .scenes {
    position: absolute; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  }
  .scenes::-webkit-scrollbar { display: none; }
  .scene { flex: 0 0 100%; height: 100%; position: relative; scroll-snap-align: start; scroll-snap-stop: always; }
  .scene canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .nav { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 13px; }
  .nav .arrow { background: none; border: none; color: var(--muted); font-size: 22px; line-height: 1; padding: 0 8px; cursor: pointer; }
  .nav .arrow:hover { color: var(--text); }
  .dots { display: flex; gap: 6px; }
  .dots button { width: 7px; height: 7px; padding: 0; border-radius: 50%; border: none; background: var(--track); cursor: pointer; }
  .dots button.on { background: var(--accent); }
  #sceneName { min-width: 70px; text-align: center; }
  .bio { position: absolute; top: 10px; left: 12px; right: 12px; text-align: center; pointer-events: none; }
  .bio-age { font-size: 24px; font-weight: 700; }
  .bio-text { color: var(--muted); font-size: 16px; margin-top: 4px; line-height: 1.35; }
  .train-info { left: 50%; right: auto; transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
    background: rgba(15, 17, 21, 0.82); border-radius: 12px; padding: 6px 14px; }
  .train-info .bio-age { font-size: 18px; }
  .zoom-btn { position: absolute; right: 10px; bottom: 54px; z-index: 1; background: rgba(15, 17, 21, 0.85); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .train-info .bio-text { font-size: 13px; }
  .bio.pop { animation: pop .5s ease-out; }
  @keyframes pop { from { opacity: 0; translate: 0 6px; } to { opacity: 1; translate: 0 0; } }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 14px 20px;
  }
  .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .timer { font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .percent { font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 4px; text-align: center; line-height: 1.5; }
  .sub b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  .panel {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center;
  }
  .field { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  input[type=time] {
    background: var(--track); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 8px; font-size: 15px; color-scheme: dark;
  }
  .btn { background: var(--track); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .hidden { display: none !important; }

  /* Телефон */
  @media (max-width: 700px) {
    body { padding: 10px; }
    .app { height: calc(100vh - 20px); height: calc(100dvh - 20px); gap: 8px; }
    .cards { gap: 8px; }
    .card { padding: 10px 8px; border-radius: 12px; }
    .label { font-size: 10px; margin-bottom: 2px; }
    .timer { font-size: 28px; }
    .percent { font-size: 28px; }
    .sub { font-size: 11px; line-height: 1.4; }
    .nav { font-size: 12px; gap: 6px; }
    .bio-age { font-size: 20px; }
    .bio-text { font-size: 14px; }
    .panel { padding: 8px 10px; gap: 8px; border-radius: 12px; }
    .field { font-size: 13px; gap: 6px; }
    input[type=time] { font-size: 14px; padding: 4px 6px; }
    #leave { width: 100%; margin-left: 0 !important; padding: 10px; font-size: 15px; }
  }

</style>
</head>
<body>
<div class="app">
  <div class="cards">
    <div class="card">
      <div class="label">Осталось</div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="sub" id="timerSub"></div>
    </div>
    <div class="card">
      <div class="label">Прошло</div>
      <div class="percent" id="percent">0%</div>
      <div class="sub" id="percentSub"></div>
    </div>
  </div>

  <div class="grid-wrap" id="gridWrap">
    <div class="scenes" id="scenes">
      <div class="scene"><canvas id="cv-shoot"></canvas></div>
      <div class="scene"><canvas id="cv-fire"></canvas></div>
      <div class="scene"><canvas id="cv-fish"></canvas></div>
      <div class="scene"><canvas id="cv-life"></canvas>
        <div class="bio" id="bio"><div class="bio-age" id="bioAge"></div><div class="bio-text" id="bioText"></div></div>
      </div>
      <div class="scene"><canvas id="cv-train"></canvas>
        <button class="zoom-btn" id="trainZoom"></button>
        <div class="bio train-info" id="trainInfo"><div class="bio-age" id="trainTop"></div><div class="bio-text" id="trainSub"></div></div>
      </div>
    </div>
  </div>
  <div class="nav">
    <button class="arrow" id="prev" aria-label="Предыдущая">‹</button>
    <div class="dots" id="dots"></div>
    <span id="sceneName"></span>
    <button class="arrow" id="next" aria-label="Следующая">›</button>
  </div>

  <div class="panel">
    <div class="field">
      Начало <input type="time" id="start" value="10:00">
      Конец <input type="time" id="end" value="19:00">
    </div>
    <button class="btn primary" id="leave" style="margin-left: auto">Уйти пораньше 🏃</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);


const load = () => { try { return JSON.parse(localStorage.getItem('workTimer')) || {}; } catch { return {}; } };
const save = () => { try { localStorage.setItem('workTimer', JSON.stringify(state)); } catch {} };

const saved = load();
const state = { start: saved.start || '10:00', end: saved.end || '19:00', scene: saved.scene || 0, trainZoom: saved.trainZoom || 0 };

// Общее для всех сцен: день делится на N частей, k — сколько частей уже прошло.
const N = 300;
const area = $('scenes');
let ctx;                       // контекст сцены, которая сейчас рисуется
const dpr = () => window.devicePixelRatio || 1;
function fitCanvas(c) {
  const W = area.clientWidth, H = area.clientHeight;
  if (!W || !H) return null;
  c.width = Math.round(W * dpr()); c.height = Math.round(H * dpr());
  return { W, H };
}
function beginFrame(c, g) {
  ctx = c.getContext('2d');
  ctx.setTransform(dpr(), 0, 0, dpr(), 0, 0);
  ctx.clearRect(0, 0, g.W, g.H);
}
// Сетка cols×rows = 300, пропорции которой ближе всего к области aw×ah
const pickGrid = (aw, ah) => [[6, 50], [10, 30], [12, 25], [15, 20], [20, 15], [25, 12], [30, 10], [50, 6], [60, 5]].reduce((a, b) =>
  Math.abs(Math.log(b[0] / b[1] * ah / aw)) < Math.abs(Math.log(a[0] / a[1] * ah / aw)) ? b : a);
// Детерминированный рандом, чтобы картинка не менялась при каждом ресайзе
const rng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const lerp = (a, b, p) => a + (b - a) * p;
const smooth = p => p * p * (3 - 2 * p);

// ===== Сцена 1. Стрелок и 300 человечков: каждый человечек = 1/300 дня =====
const cvs = $('cv-shoot');
// мс: полёт пули, падение, интервал между выстрелами (в режиме «уйти пораньше» всё быстрее)
let T_BULLET = 260, T_FALL = 420, T_GAP = 700;
// Цели идут по порядку: слева направо, ряд за рядом сверху вниз
const ORDER = [...Array(N).keys()];
const crowd = { geo: null, k: -1, dead: 0, shots: [], aim: 0 };

function crowdGeometry() {
  const W = area.clientWidth, H = area.clientHeight;
  if (!W || !H) return null;
  let S, sx, sy, x0, x1, y0, y1;
  if (H > W * 1.05) {
    // вертикальный экран (телефон): стрелок внизу по центру, толпа над ним на всю ширину
    S = Math.min(W * 0.2, H * 0.16);
    sx = W / 2; sy = H - 4;
    x0 = 4; x1 = W - 4; y0 = 4; y1 = H - S * 1.3;
  } else {
    S = Math.min(H * 0.42, W * 0.12);              // рост стрелка
    sx = Math.max(S * 0.6, W * 0.07); sy = H / 2 + S / 2;
    x0 = sx + S * 1.6; x1 = W - 8; y0 = 8; y1 = H - 8;
  }
  const aw = x1 - x0, ah = y1 - y0;
  const [cols, rows] = pickGrid(aw, ah);
  const cw = aw / cols, ch = ah / rows, s = Math.min(cw * 0.75, ch * 0.85);
  const people = [...Array(N).keys()].map(i => {
    const c = i % cols, r = Math.floor(i / cols);
    return { x: x0 + (c + 0.5) * cw, y: y0 + (r + 1) * ch - ch * 0.08 };   // y — уровень ног
  });
  return { W, H, S, sx, sy, s, people };
}

// Особые человечки: каждый 10-й — в шляпе, а тот, на котором заканчивается очередной час, — большой и толстый
const isHat = r => (r + 1) % 10 === 0;
function isFat(r) {
  const hours = dayLenMs() / 3600000;
  return Math.floor((r + 1) * hours / N + 1e-9) > Math.floor(r * hours / N + 1e-9);
}
const kindOf = r => isFat(r) ? 'fat' : isHat(r) ? 'hat' : 'norm';
// Подготовка к особому выстрелу (мс): на колено — по шляпе, оптика — по толстому
const PREP = { hat: 700, fat: 1500 }, HOLD = 450, BACK = 400;
const fallTime = s => T_FALL * (s.kind === 'fat' ? 1.6 : 1);

// Палочный человечек: (x, y) — ноги, a — угол падения (0 стоит, π/2 лежит), rank — его номер в очереди
function figure(x, y, s, a, color, lw, rank) {
  const fat = rank != null && isFat(rank), hat = rank != null && isHat(rank);
  const z = fat ? s * 1.3 : s, aw = fat ? 0.26 : 0.2;
  ctx.save();
  ctx.translate(x - z * 0.45 * Math.sin(a), y); ctx.rotate(a);
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = (lw || Math.max(1.5, s * 0.08)) * (fat ? 1.8 : 1);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(-z * 0.16, 0); ctx.lineTo(0, -z * 0.42); ctx.lineTo(z * 0.16, 0);          // ноги
  ctx.moveTo(0, -z * 0.42); ctx.lineTo(0, -z * 0.74);                                    // туловище
  ctx.moveTo(-z * aw, -z * 0.5); ctx.lineTo(0, -z * 0.68); ctx.lineTo(z * aw, -z * 0.5); // руки
  ctx.stroke();
  if (fat) { ctx.beginPath(); ctx.ellipse(0, -z * 0.57, z * 0.17, z * 0.2, 0, 0, 7); ctx.fill(); } // пузо
  ctx.beginPath(); ctx.arc(0, -z * 0.86, z * (fat ? 0.13 : 0.12), 0, 7); ctx.fill();               // голова
  if (hat) {
    ctx.fillStyle = '#b07a4a';
    ctx.fillRect(-z * 0.21, -z * 0.98, z * 0.42, z * 0.05);                                       // поля
    ctx.beginPath(); ctx.roundRect(-z * 0.11, -z * 1.16, z * 0.22, z * 0.2, z * 0.03); ctx.fill(); // тулья
  }
  ctx.restore();
}

// Стрелок с винтовкой. pose: kneel — на колене, scope — смотрит в оптику, recoil — отдача (всё 0..1)
function shooterJoints(g, pose) {
  const { S, sx, sy } = g, k = pose.kneel, sc = pose.scope;
  const L = (a, b) => a + (b - a) * k;
  const hipY = L(sy - S * 0.42, sy - S * 0.26), dy = hipY - (sy - S * 0.42);
  return {
    L, hipY, dy,
    neck: [sx + S * 0.03 * sc, sy - S * 0.74 + dy],
    head: [sx + S * 0.07 * sc, sy - S * 0.86 + dy - S * 0.01 * sc],
    shoulder: [sx + S * 0.02 * sc, sy - S * 0.68 + dy],
    // при прицеливании винтовка поднимается к глазу
    gun: [sx + S * 0.03 * sc, sy - S * 0.68 + dy - S * 0.13 * sc],
  };
}

function drawShooter(g, angle, pose) {
  const { S, sx, sy } = g, lw = Math.max(2.5, S * 0.06), J = shooterJoints(g, pose), L = J.L;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = ctx.fillStyle = '#4f9cff'; ctx.lineWidth = lw;
  ctx.beginPath();
  // задняя нога (на колене — колено на земле)
  ctx.moveTo(sx, J.hipY); ctx.lineTo(L(sx - S * 0.085, sx - S * 0.1), L(sy - S * 0.21, sy - S * 0.01));
  ctx.lineTo(L(sx - S * 0.17, sx - S * 0.32), L(sy, sy - S * 0.02));
  // передняя нога
  ctx.moveTo(sx, J.hipY); ctx.lineTo(L(sx + S * 0.085, sx + S * 0.17), L(sy - S * 0.21, sy - S * 0.22));
  ctx.lineTo(L(sx + S * 0.17, sx + S * 0.17), sy);
  // туловище
  ctx.moveTo(sx, J.hipY); ctx.lineTo(...J.neck);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(...J.head, S * 0.12, 0, 7); ctx.fill();

  // винтовка: P(d, o) — точка на расстоянии d вдоль ствола и o «вверх» от него
  const ca = Math.cos(angle), sa = Math.sin(angle), back = pose.recoil * S * 0.06;
  const P = (d, o = 0) => [J.gun[0] + ca * (d * S - back) + sa * o * S, J.gun[1] + sa * (d * S - back) - ca * o * S];
  const seg = (a, b, w, c) => { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); };
  // руки держат винтовку
  ctx.strokeStyle = '#4f9cff'; ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.moveTo(...J.shoulder); ctx.lineTo(...P(0.06, -0.03));
  ctx.moveTo(...J.shoulder); ctx.lineTo(...P(0.32, -0.03));
  ctx.stroke();
  ctx.lineCap = 'butt';
  seg(P(-0.12, -0.01), P(0.1), lw * 2.3, '#9a6a42');            // приклад
  seg(P(0.1), P(0.4), lw * 1.5, '#6b7280');                     // ствольная коробка
  seg(P(0.4), P(0.74), lw * 0.75, '#c9ced8');                   // ствол
  seg(P(0.14, 0.055), P(0.32, 0.055), lw * 1.1, '#2f343f');     // оптика
  seg(P(0.14, 0.055), P(0.32, 0.055), lw * 0.5, '#8fc0ff');
  if (pose.flash) {
    const r = S * (pose.big ? 0.11 : 0.07), [fx, fy] = P(0.8);
    ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(fx, fy, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff4c9'; ctx.beginPath(); ctx.arc(fx, fy, r * 0.5, 0, 7); ctx.fill();
  }
  ctx.restore();
  return P(0.74);   // дульный срез
}

function drawCrowd(k, force) {
  k = Math.max(0, Math.min(N, k));
  if (force || !crowd.geo) {
    crowd.geo = crowdGeometry(); if (!crowd.geo) return;
    fitCanvas(cvs);
    crowd.shots = []; crowd.dead = Math.max(0, crowd.k);
  }
  if (k === crowd.k) return;
  const diff = k - crowd.k;
  if (crowd.k >= 0 && diff > 0 && (diff <= 3 || fast)) {
    const now = performance.now(), gapAfter = s => s.kind === 'norm' ? T_GAP : HOLD + BACK;
    let start = Math.max(now, ...crowd.shots.map(s => s.t0 + gapAfter(s)));
    for (let i = crowd.k; i < k; i++) {
      const kind = fast ? 'norm' : kindOf(i);        // в «уйти пораньше» без церемоний
      const s = { n: i, kind, t0: start + (PREP[kind] || 0) };
      crowd.shots.push(s); start = s.t0 + gapAfter(s);
    }
  } else { crowd.shots = []; crowd.dead = k; }   // большой скачок — без анимации
  crowd.k = k;
}

function crowdFrame(now) {
  const g = crowd.geo; if (!g) return;
  beginFrame(cvs, g);

  // какие выстрелы закончились — человечек окончательно лежит, стрелок вернулся в стойку
  crowd.shots = crowd.shots.filter(s => {
    const t = now - s.t0;
    if (t >= T_BULLET + fallTime(s)) crowd.dead = Math.max(crowd.dead, s.n + 1);
    return t < Math.max(T_BULLET + fallTime(s), s.kind === 'norm' ? 0 : HOLD + BACK);
  });
  const fall = {};
  for (const s of crowd.shots) {
    const t = now - s.t0 - T_BULLET;
    if (s.n >= crowd.dead) fall[ORDER[s.n]] = t <= 0 ? 0 : Math.min(1, t / fallTime(s));
  }

  // поза стрелка
  const pose = { kneel: 0, scope: 0, recoil: 0, flash: false, big: false };
  for (const s of crowd.shots) {
    const t = now - s.t0;
    if (t >= 0 && t < 140) { pose.recoil = 1 - t / 140; pose.flash = t < 90; pose.big = s.kind === 'fat'; }
    if (s.kind === 'norm') continue;
    const pre = PREP[s.kind];
    if (t < -pre || t > HOLD + BACK) continue;
    const p = t < 0 ? Math.min(1, (t + pre) / (pre * 0.5)) : t < HOLD ? 1 : Math.max(0, 1 - (t - HOLD) / BACK);
    const e = p * p * (3 - 2 * p);
    if (s.kind === 'hat') pose.kneel = Math.max(pose.kneel, e); else pose.scope = Math.max(pose.scope, e);
  }

  // толпа
  const lw = Math.max(1.5, g.s * 0.08);
  g.people.forEach((p, i) => {
    const rank = ORDER.indexOf(i);
    if (rank < crowd.dead) {
      ctx.fillStyle = 'rgba(192, 70, 70, 0.35)';
      const pr = isFat(rank) ? 1.3 : 1;
      ctx.beginPath(); ctx.ellipse(p.x, p.y - g.s * 0.04, g.s * 0.45 * pr, g.s * 0.07 * pr, 0, 0, 7); ctx.fill();
      figure(p.x, p.y - g.s * 0.08, g.s, Math.PI / 2, '#6b6f7a', lw, rank);
    } else if (i in fall) {
      const f = fall[i], e = f * f;
      figure(p.x, p.y - g.s * 0.08 * e, g.s, e * Math.PI / 2, f > 0 ? '#e07a7a' : '#e8eaf0', lw, rank);
    } else {
      figure(p.x, p.y, g.s, 0, '#e8eaf0', lw, rank);
    }
  });

  // цель: текущий выстрел (или подготовка к нему) либо следующий по очереди
  const started = crowd.shots.filter(s => now >= s.t0 - Math.max(T_GAP * 0.6, PREP[s.kind] || 0));
  const shot = started[started.length - 1];
  const n = shot ? shot.n : crowd.k;
  const J = shooterJoints(g, pose);
  if (n >= 0 && n < N) {
    const p = g.people[ORDER[n]], big = isFat(n) ? 1.3 : 1, tx = p.x, ty = p.y - g.s * 0.6 * big;
    ctx.strokeStyle = 'rgba(255, 90, 90, 0.8)'; ctx.lineWidth = 1.5;
    if (!shot) {   // обычный прицел на следующем
      const r = g.s * 0.42 * big;
      ctx.beginPath(); ctx.arc(tx, ty, r, 0, 7);
      ctx.moveTo(tx - r * 1.3, ty); ctx.lineTo(tx - r * 0.6, ty); ctx.moveTo(tx + r * 0.6, ty); ctx.lineTo(tx + r * 1.3, ty);
      ctx.moveTo(tx, ty - r * 1.3); ctx.lineTo(tx, ty - r * 0.6); ctx.moveTo(tx, ty + r * 0.6); ctx.lineTo(tx, ty + r * 1.3);
      ctx.stroke();
    } else if (pose.scope > 0.05) {   // вид через оптику: большое кольцо сходится на толстом
      const r = g.s * (2.6 - 1.4 * pose.scope);
      ctx.save(); ctx.globalAlpha = pose.scope;
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(20, 22, 28, 0.85)';
      ctx.beginPath(); ctx.arc(tx, ty, r + 3, 0, 7); ctx.stroke();
      ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255, 90, 90, 0.95)';
      ctx.beginPath(); ctx.arc(tx, ty, r, 0, 7);
      ctx.moveTo(tx - r, ty); ctx.lineTo(tx + r, ty); ctx.moveTo(tx, ty - r); ctx.lineTo(tx, ty + r);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255, 90, 90, 0.95)'; ctx.beginPath(); ctx.arc(tx, ty, 2, 0, 7); ctx.fill();
      ctx.restore();
    }
    const want = Math.atan2(ty - J.gun[1], tx - J.gun[0]);
    crowd.aim += (want - crowd.aim) * 0.15;   // плавно наводит винтовку
  }
  const tip = drawShooter(g, crowd.aim, pose);
  // все пули в полёте (в быстром режиме их несколько сразу)
  ctx.fillStyle = '#ffd36b';
  for (const s of crowd.shots) {
    const t = now - s.t0; if (t < 0 || t >= T_BULLET) continue;
    const p = g.people[ORDER[s.n]], q = t / T_BULLET, tx = p.x, ty = p.y - g.s * 0.6 * (s.kind === 'fat' ? 1.3 : 1);
    ctx.beginPath(); ctx.arc(tip[0] + (tx - tip[0]) * q, tip[1] + (ty - tip[1]) * q, Math.max(2, g.S * 0.025), 0, 7); ctx.fill();
  }
}

// Человечек сбоку (костёр, рыбалка). x — между ног, gy — земля, dir: 1 смотрит вправо, -1 влево.
// o.walk — фаза шага, o.bend 0..1 — наклон, o.hands(sh) → две руки в локальных координатах.
// Возвращает положение рук на холсте.
function walker(x, gy, S, o) {
  const lw = Math.max(2.5, S * 0.06), L = S * 0.42, T = S * 0.32, A = S * 0.32;
  const walking = o.walk != null, b = o.bend || 0;
  const a = walking ? 0.5 * Math.sin(o.walk) : 0.2;
  const hip = [0, -L * Math.cos(walking ? Math.abs(a) : 0.2) + b * S * 0.12 + (o.bob || 0)];
  const tb = b * 1.1, up = [Math.sin(tb), -Math.cos(tb)];
  const sh = [hip[0] + up[0] * T * 0.85, hip[1] + up[1] * T * 0.85];
  const neck = [hip[0] + up[0] * T, hip[1] + up[1] * T];
  const head = [hip[0] + up[0] * (T + S * 0.13), hip[1] + up[1] * (T + S * 0.13)];
  const sw = walking ? Math.sin(o.walk) : 0;
  const hands = o.hands ? o.hands(sh) : [[sh[0] + S * 0.14 * sw, sh[1] + S * 0.28], [sh[0] - S * 0.14 * sw, sh[1] + S * 0.28]];
  // сустав (колено/локоть) между p и q, выгнутый в сторону side
  const joint = (p, q, len, side) => {
    const dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy) || 1, h = Math.sqrt(Math.max(0, (len / 2) ** 2 - (d / 2) ** 2));
    return [(p[0] + q[0]) / 2 + side * -dy / d * h, (p[1] + q[1]) / 2 + side * dx / d * h];
  };
  ctx.save(); ctx.translate(x, gy); ctx.scale(dir(o), 1);
  ctx.strokeStyle = ctx.fillStyle = o.color || '#4f9cff'; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  for (const f of [[hip[0] + L * Math.sin(a), 0], [hip[0] - L * Math.sin(a), 0]]) {
    const kn = joint(hip, f, L, -1);
    ctx.moveTo(...hip); ctx.lineTo(...kn); ctx.lineTo(...f);
  }
  ctx.moveTo(...hip); ctx.lineTo(...neck);
  for (const h of hands) { ctx.moveTo(...sh); ctx.lineTo(...joint(sh, h, A, 1)); ctx.lineTo(...h); }
  ctx.stroke();
  if (o.head) ctx.fillStyle = o.head;
  ctx.beginPath(); ctx.arc(...head, S * 0.12, 0, 7); ctx.fill();
  ctx.restore();
  const out = hands.map(h => [x + dir(o) * h[0], gy + h[1]]);
  out.head = [x + dir(o) * head[0], gy + head[1]];
  return out;
}
const dir = o => o.dir || 1;

// ===== Сцена 2. Костёр: в поленнице ровно столько поленьев, сколько осталось частей дня =====
const fireCvs = $('cv-fire');
const fire = { geo: null, k: -1, trips: [], tosses: [] };
const F_ROLL = 900, F_PICK = 500, F_THROW = 550, F_REST = 300, F_TOSS = 650;

function fireGeometry() {
  const W = area.clientWidth, H = area.clientHeight;
  if (!W || !H) return null;
  const gy = H - 6, S = Math.min(H * 0.3, W * 0.2), fw = S * 0.95, fx = W - fw / 2 - 10;
  const pw = Math.max(40, Math.min(W - 26 - fw - S * 1.6, W * 0.55)), ph = gy - 12;
  const [cols, rows] = pickGrid(pw, ph), d = Math.min(pw / cols, ph / rows);
  const px0 = 10 + Math.max(2, d * 0.15), px1 = px0 + cols * d, r = rng(7);
  // rank 0 берут первым: верхний ряд, справа налево
  const logs = [...Array(N).keys()].map(i => {
    const row = Math.floor(i / cols), col = cols - 1 - i % cols;
    return { x: px0 + (col + 0.5) * d + (r() - 0.5) * d * 0.06, y: gy - (rows - row - 0.5) * d + (r() - 0.5) * d * 0.04,
             r: d * (0.44 + r() * 0.05), rot: r() * 7 };
  });
  const P = { x: px1 + d * 0.9, y: gy - d * 0.47 };            // куда скатывается взятое полено
  const xp = P.x + S * 0.3, xm = fx - fw * 0.55 - S * 0.12;     // где стоит у поленницы и у костра
  return { W, H, gy, S, fw, fx, d, px0, px1, top: gy - rows * d, logs, P, xp, xm,
           walkT: Math.max(400, Math.abs(xm - xp) / (S * 1.6) * 1000) };
}

function fireSet(k, force) {
  k = Math.max(0, Math.min(N, k));
  if (force || !fire.geo) {
    fire.geo = fireGeometry(); if (!fire.geo) return;
    fitCanvas(fireCvs); fire.trips = []; fire.tosses = [];
  }
  if (k === fire.k) return;
  const diff = k - fire.k, now = performance.now();
  if (fire.k >= 0 && diff > 0 && fast) {
    for (let i = fire.k; i < k; i++) fire.tosses.push({ r: i, t0: now + (i - fire.k) * 25 });
  } else if (fire.k >= 0 && diff > 0 && diff <= 3) {
    // полено скатывается сразу (в поленнице всегда ровно N − k), человек идёт за ним, когда освободится
    const w = fire.geo.walkT;
    let start = Math.max(now, ...fire.trips.map(t => t.end));
    for (let i = fire.k; i < k; i++) {
      const t = { r: i, tick: now, start };
      t.tArrive = Math.max(start + w, now + F_ROLL); t.tPick = t.tArrive + F_PICK;
      t.tBack = t.tPick + w; t.tLand = t.tBack + F_THROW; t.end = t.tLand + F_REST;
      fire.trips.push(t); start = t.end;
    }
  } else { fire.trips = []; fire.tosses = []; }
  fire.k = k;
}

// Полено с торца; берёзовые — те, на которых заканчивается очередной час
function drawLog(x, y, r, rot, rank) {
  const birch = rank != null && isFat(rank);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = birch ? '#e9e4d6' : '#6e4526'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = birch ? '#e8c890' : '#c8925a'; ctx.beginPath(); ctx.arc(0, 0, r * 0.78, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(110, 69, 38, 0.55)'; ctx.lineWidth = Math.max(0.6, r * 0.08);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.42, 0, 7);
  if (r > 4) { ctx.moveTo(r * 0.1, 0); ctx.lineTo(r * 0.72, 0); }
  ctx.stroke();
  if (birch && r > 4) { ctx.fillStyle = '#2a2a2a'; ctx.fillRect(-r * 0.15, -r * 0.98, r * 0.3, r * 0.12); ctx.fillRect(r * 0.6, r * 0.5, r * 0.25, r * 0.12); }
  ctx.restore();
}

function drawFire(g, now, boost) {
  const { fx, gy, fw } = g, a = Math.sqrt(fire.k / N);
  // зарево
  const R = fw * (1.5 + boost * 0.6), gr = ctx.createRadialGradient(fx, gy - fw * 0.3, 0, fx, gy - fw * 0.3, R);
  gr.addColorStop(0, `rgba(255, 140, 50, ${0.22 + boost * 0.15})`); gr.addColorStop(1, 'rgba(255, 140, 50, 0)');
  ctx.fillStyle = gr; ctx.fillRect(fx - R, gy - fw * 0.3 - R, R * 2, R * 2);
  // зола растёт вместе с прошедшим временем
  const hw = fw * (0.5 + 0.5 * a), hh = fw * (0.05 + 0.17 * a);
  ctx.fillStyle = '#3a3f4a'; ctx.beginPath(); ctx.ellipse(fx, gy, hw / 2, hh, 0, Math.PI, Math.PI * 2); ctx.fill();
  const r = rng(3);
  for (let i = 0; i < 9; i++) {
    const ex = fx + (r() - 0.5) * hw * 0.8, ey = gy - r() * hh * 0.7, f = 0.5 + 0.5 * Math.sin(now / (180 + i * 40) + i);
    ctx.fillStyle = `rgba(255, ${120 + f * 80 | 0}, 60, ${0.4 + f * 0.5})`;
    ctx.beginPath(); ctx.arc(ex, ey, Math.max(1, fw * 0.025), 0, 7); ctx.fill();
  }
  const base = gy - hh * 0.6;
  // дрова в костре
  ctx.lineCap = 'round'; ctx.lineWidth = fw * 0.09; ctx.strokeStyle = '#5a3a22';
  ctx.beginPath(); ctx.moveTo(fx - fw * 0.38, base + fw * 0.02); ctx.lineTo(fx + fw * 0.2, base - fw * 0.16);
  ctx.moveTo(fx + fw * 0.38, base + fw * 0.02); ctx.lineTo(fx - fw * 0.2, base - fw * 0.16); ctx.stroke();
  // языки пламени
  for (const [col, sc] of [['#ff6b2c', 1], ['#ffb347', 0.66], ['#fff1a8', 0.36]]) {
    ctx.fillStyle = col;
    for (let i = 0; i < 5; i++) {
      const ox = (i - 2) * fw * 0.13 * sc, w = fw * 0.13 * sc + fw * 0.03;
      const h = fw * sc * (i === 2 ? 0.95 : 0.6) * (0.85 + 0.15 * Math.sin(now / 130 + i * 1.7) + 0.08 * Math.sin(now / 71 + i * 3)) * (1 + boost * 0.6);
      const sway = Math.sin(now / 200 + i) * fw * 0.05;
      ctx.beginPath(); ctx.moveTo(fx + ox - w, base);
      ctx.quadraticCurveTo(fx + ox - w * 0.8, base - h * 0.6, fx + ox + sway, base - h);
      ctx.quadraticCurveTo(fx + ox + w * 0.8, base - h * 0.6, fx + ox + w, base); ctx.fill();
    }
  }
  return base;
}

function fireFrame(now) {
  const g = fire.geo; if (!g) return;
  beginFrame(fireCvs, g);
  fire.trips = fire.trips.filter(t => now < t.end + 1500);
  fire.tosses = fire.tosses.filter(t => now < t.t0 + F_TOSS + 1500);
  const { gy, S, d, P, fx, fw } = g;

  // земля и колья поленницы
  ctx.strokeStyle = '#2a2f3a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, gy + 1); ctx.lineTo(g.W, gy + 1); ctx.stroke();
  ctx.strokeStyle = '#5a3a22'; ctx.lineWidth = Math.max(2, d * 0.18); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(g.px0 - ctx.lineWidth / 2, gy); ctx.lineTo(g.px0 - ctx.lineWidth / 2, g.top - d * 0.2);
  ctx.moveTo(g.px1 + ctx.lineWidth / 2, gy); ctx.lineTo(g.px1 + ctx.lineWidth / 2, Math.max(g.top - d * 0.2, gy - d * 3)); ctx.stroke();

  for (let r = fire.k; r < N; r++) { const l = g.logs[r]; drawLog(l.x, l.y, l.r, l.rot, r); }

  let boost = 0;
  for (const t of fire.trips) if (now > t.tLand) boost = Math.max(boost, 1 - (now - t.tLand) / 1200);
  for (const t of fire.tosses) if (now > t.t0 + F_TOSS) boost = Math.max(boost, 0.6 - (now - t.t0 - F_TOSS) / 1500);
  const base = drawFire(g, now, boost);
  // искры от только что брошенного полена
  ctx.fillStyle = '#ffd36b';
  for (const t of fire.trips) {
    const e = now - t.tLand; if (e < 0 || e > 1100) continue;
    const r = rng(t.r);
    for (let i = 0; i < 7; i++) {
      const vx = (r() - 0.5) * fw * 0.8, vy = fw * (0.8 + r() * 0.9), q = e / 1100;
      ctx.globalAlpha = 1 - q; ctx.beginPath();
      ctx.arc(fx + vx * q, base - fw * 0.3 - vy * q + fw * 0.3 * q * q, Math.max(1, fw * 0.025), 0, 7); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // в «уйти пораньше» поленья летят в костёр сами
  const fireIn = [fx, base - fw * 0.15];
  for (const t of fire.tosses) {
    const p = (now - t.t0) / F_TOSS; if (p < 0 || p >= 1) continue;
    const l = g.logs[t.r];
    drawLog(lerp(l.x, fireIn[0], p), lerp(l.y, fireIn[1], p) - S * 1.2 * 4 * p * (1 - p), l.r, l.rot + p * 9, t.r);
  }

  // взятые поленья: скатываются, лежат у поленницы, летят в костёр
  const cur = fire.trips.find(t => now >= t.start && now < t.end);
  let lying = 0;
  for (const t of fire.trips) {
    const l = g.logs[t.r], e = now - t.tick;
    if (e < F_ROLL) {
      const p = e / F_ROLL, pe = Math.max(0, Math.min(0.9, (g.px1 - l.x) / (P.x - l.x || 1)));
      const y = p < pe ? l.y : lerp(l.y, P.y, ((p - pe) / (1 - pe)) ** 2);
      drawLog(lerp(l.x, P.x, p), y, l.r, l.rot + p * (P.x - l.x) / l.r, t.r);
    } else if (now < t.tPick + F_PICK * 0.5) {
      drawLog(P.x - lying++ * d * 0.25, P.y, l.r, l.rot + (P.x - l.x) / l.r, t.r);
    } else if (now >= t.tBack + F_THROW * 0.4 && now < t.tLand) {
      const p = (now - t.tBack - F_THROW * 0.4) / (F_THROW * 0.6), h = [g.xm + S * 0.3, gy - S * 0.85];
      drawLog(lerp(h[0], fireIn[0], p), lerp(h[1], fireIn[1], p) - S * 0.35 * 4 * p * (1 - p), l.r, l.rot + p * 6, t.r);
    }
  }

  // человек
  const warm = sh => [[sh[0] + S * 0.3, sh[1] + S * 0.04], [sh[0] + S * 0.27, sh[1] + S * 0.1]];
  let o = { dir: 1, hands: warm, bob: Math.sin(now / 600) * S * 0.008 }, x = g.xm, carry = null;
  if (fast) o = { dir: 1, bob: -Math.abs(Math.sin(now / 160)) * S * 0.08, hands: sh => [[sh[0] + S * 0.12, sh[1] - S * 0.3], [sh[0] - S * 0.1, sh[1] - S * 0.3]] };
  else if (cur) {
    const t = cur, w = g.walkT, l = g.logs[t.r];
    const carryHands = sh => [[sh[0] + S * 0.22, sh[1] + S * 0.12], [sh[0] + S * 0.2, sh[1] + S * 0.16]];
    if (now < t.start + w) {
      const p = (now - t.start) / w; x = lerp(g.xm, g.xp, p);
      o = { dir: -1, walk: Math.abs(x - g.xm) / (S * 0.18) };
    } else if (now < t.tArrive) { x = g.xp; o = { dir: -1 }; }
    else if (now < t.tPick) {
      const p = (now - t.tArrive) / F_PICK, b = Math.sin(Math.PI * p);
      x = g.xp;
      o = { dir: -1, bend: b, hands: sh => { const gp = [S * 0.3, -d * 0.47], hc = [sh[0] + S * 0.2, sh[1] + S * 0.14];
        return [[lerp(hc[0], gp[0], b), lerp(hc[1], gp[1], b)], [lerp(hc[0], gp[0], b) - S * 0.03, lerp(hc[1], gp[1], b)]]; } };
      if (p > 0.5) carry = l;
    } else if (now < t.tBack) {
      const p = (now - t.tPick) / w; x = lerp(g.xp, g.xm, p);
      o = { dir: 1, walk: Math.abs(x - g.xp) / (S * 0.18), hands: carryHands }; carry = l;
    } else if (now < t.tLand) {
      const p = (now - t.tBack) / F_THROW, th = lerp(0.6, -0.9, smooth(Math.min(1, p / 0.5)));
      o = { dir: 1, hands: sh => [[sh[0] + Math.cos(th) * S * 0.3, sh[1] + Math.sin(th) * S * 0.3], [sh[0] + Math.cos(th) * S * 0.28, sh[1] + Math.sin(th) * S * 0.3 + S * 0.03]] };
      if (p < 0.4) carry = l;
    }
  }
  const hands = walker(x, gy, S, o);
  if (carry) drawLog((hands[0][0] + hands[1][0]) / 2, (hands[0][1] + hands[1][1]) / 2 - carry.r * 0.6, carry.r, carry.rot, cur.r);
}

// ===== Сцена 3. Рыбалка: в пруду ровно столько рыб, сколько осталось частей дня =====
const fishCvs = $('cv-fish');
const pond = { geo: null, k: -1, ev: [], jumps: [] };
const P_BITE = 650, P_FIGHT = 1700, P_OUT = 750, P_JUMP = 700;

function pondGeometry() {
  const W = area.clientWidth, H = area.clientHeight;
  if (!W || !H) return null;
  const S = Math.min(H * 0.22, W * 0.2), sy = Math.max(S * 1.35 + 10, H * 0.26);
  const deck = sy - S * 0.2, pier = S * 1.0, mx = S * 0.62;
  const grip = [mx + S * 0.22, deck - S * 0.55];
  const tip = [Math.min(W - 12, mx + S * 1.9), Math.max(6, deck - S * 1.3)];
  const flt = [Math.max(pier + S * 0.2, tip[0] + S * 0.1), sy], hook = [flt[0], sy + S * 0.55];
  const bucket = { x: S * 0.22, y: deck, w: S * 0.32, h: S * 0.3 };
  const x0 = 10, x1 = W - 10, y0 = sy + 14, y1 = H - 14;
  const [cols, rows] = pickGrid(x1 - x0, y1 - y0), cw = (x1 - x0) / cols, ch = (y1 - y0) / rows;
  const len = Math.min(cw * 0.75, ch * 1.6, 30), r = rng(11);
  const fish = [...Array(N).keys()].map(i => ({
    hx: x0 + (i % cols + 0.5) * cw + (r() - 0.5) * cw * 0.5, hy: y0 + (Math.floor(i / cols) + 0.5) * ch + (r() - 0.5) * ch * 0.4,
    ax: cw * (0.25 + r() * 0.3), ay: ch * 0.15, w: 0.25 + r() * 0.4, ph: r() * 7, ph2: r() * 7,
  }));
  // какая рыба попадётся следующей — вперемешку
  const order = [...Array(N).keys()];
  for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const weeds = [...Array(Math.max(4, Math.round(W / 45)))].map(() => ({ x: r() * W, h: S * (0.3 + r() * 0.5), ph: r() * 7 }));
  return { W, H, S, sy, deck, pier, mx, grip, tip, flt, hook, bucket, fish, order, len, weeds };
}

// где рыба сейчас плавает сама по себе
function wander(g, rank, now) {
  const f = g.fish[g.order[rank]], t = now / 1000;
  return { x: f.hx + f.ax * Math.sin(f.w * t + f.ph), y: f.hy + f.ay * Math.sin(1.7 * f.w * t + f.ph2), dir: Math.cos(f.w * t + f.ph) >= 0 ? 1 : -1 };
}
const fishLen = (g, r) => g.len * (isFat(r) ? 1.8 : 1);
const fishColor = r => isFat(r) ? '#ffd36b' : isHat(r) ? '#ff9f6b' : '#9fb3c8';

function pondSet(k, force) {
  k = Math.max(0, Math.min(N, k));
  if (force || !pond.geo) {
    pond.geo = pondGeometry(); if (!pond.geo) return;
    fitCanvas(fishCvs); pond.ev = []; pond.jumps = [];
  }
  if (k === pond.k) return;
  const diff = k - pond.k, now = performance.now(), g = pond.geo;
  if (pond.k >= 0 && diff > 0 && fast) {
    for (let i = pond.k; i < k; i++) pond.jumps.push({ r: i, t0: now + (i - pond.k) * 25 });
  } else if (pond.k >= 0 && diff > 0 && diff <= 3) {
    let start = Math.max(now, ...pond.ev.map(e => e.end));
    for (let i = pond.k; i < k; i++) {
      const w = wander(g, i, start), dist = Math.hypot(w.x - g.hook[0], w.y - g.hook[1]);
      const e = { r: i, t0: start };
      e.tHook = start + Math.max(600, Math.min(3000, dist / (g.S * 1.3) * 1000));
      e.tBite = e.tHook + (isFat(i) ? P_FIGHT : P_BITE); e.tOut = e.tBite + P_OUT; e.end = e.tOut + 250;
      pond.ev.push(e); start = e.end;
    }
  } else { pond.ev = []; pond.jumps = []; }
  pond.k = k;
}

function drawFish(x, y, len, dir, color, wag, rot) {
  ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(dir, 1);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(0, 0, len * 0.5, len * 0.2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-len * 0.4, 0); ctx.lineTo(-len * 0.72, -len * 0.2 + wag); ctx.lineTo(-len * 0.72, len * 0.2 + wag); ctx.fill();
  if (len > 9) { ctx.fillStyle = '#0f1115'; ctx.beginPath(); ctx.arc(len * 0.28, -len * 0.04, Math.max(1, len * 0.045), 0, 7); ctx.fill(); }
  ctx.restore();
}

function pondFrame(now) {
  const g = pond.geo; if (!g) return;
  beginFrame(fishCvs, g);
  pond.ev = pond.ev.filter(e => now < e.end);
  pond.jumps = pond.jumps.filter(j => now < j.t0 + P_JUMP);
  const { S, sy, deck, W, H, hook, flt, bucket } = g;

  // вода
  const wg = ctx.createLinearGradient(0, sy, 0, H);
  wg.addColorStop(0, '#163650'); wg.addColorStop(1, '#0b1a28');
  ctx.fillStyle = wg; ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, sy + Math.sin(x / 23 + now / 700) * 1.5);
  ctx.lineTo(W, H); ctx.fill();
  ctx.fillStyle = '#2b2a24'; ctx.fillRect(0, H - 8, W, 8);
  ctx.strokeStyle = '#2f6b4a'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const wd of g.weeds) {
    ctx.beginPath(); ctx.moveTo(wd.x, H - 6);
    ctx.quadraticCurveTo(wd.x + Math.sin(now / 900 + wd.ph) * S * 0.12, H - 6 - wd.h * 0.5, wd.x + Math.sin(now / 700 + wd.ph) * S * 0.18, H - 6 - wd.h);
    ctx.stroke();
  }

  // активный улов
  const cur = pond.ev.find(e => now >= e.t0);
  const inEv = {}; for (const e of pond.ev) inEv[e.r] = e;
  const fighting = cur && now >= cur.tHook && now < cur.tBite;

  // рыбы в пруду: все, кого ещё не вытащили
  const lenAll = g.len;
  for (let r = 0; r < N; r++) {
    const e = inEv[r];
    if (r < pond.k && !(e && now < e.tBite)) continue;
    if (pond.jumps.some(j => j.r === r && now >= j.t0)) continue;
    const L = fishLen(g, r), wag = Math.sin(now / 150 + r) * L * 0.08;
    let p = wander(g, r, now);
    if (e && now >= e.t0) {
      if (now < e.tHook) {
        const q = smooth((now - e.t0) / (e.tHook - e.t0));
        p = { x: lerp(p.x, hook[0] - L * 0.45, q), y: lerp(p.y, hook[1], q), dir: hook[0] - p.x >= 0 ? 1 : -1 };
      } else {
        const big = isFat(r), sh = big ? Math.sin(now / 45) * L * 0.15 : Math.sin(now / 70) * L * 0.05;
        p = { x: hook[0] - L * 0.45 + sh, y: hook[1] + (big ? Math.cos(now / 60) * L * 0.1 : 0), dir: 1 };
      }
    }
    drawFish(p.x, p.y, L, p.dir, fishColor(r), wag * (e ? 2 : 1));
  }

  // пирс
  ctx.fillStyle = '#5a3a22';
  for (const px of [g.pier * 0.3, g.pier * 0.85]) ctx.fillRect(px - S * 0.03, deck, S * 0.06, sy + S * 0.35 - deck);
  ctx.fillStyle = '#7a5232'; ctx.fillRect(0, deck, g.pier, Math.max(3, S * 0.06));

  // ведро с уловом
  const { x: bx, y: by, w: bw, h: bh } = bucket;
  if (pond.k > 0) for (let i = 0; i < Math.min(pond.k, 4); i++)
    drawFish(bx - bw * 0.2 + i * bw * 0.13, by - bh - lenAll * 0.15, lenAll * 0.8, 1, fishColor(pond.k - 1 - i), 0, -1.3 + i * 0.25);
  ctx.fillStyle = '#6b7280'; ctx.beginPath();
  ctx.moveTo(bx - bw / 2, by - bh); ctx.lineTo(bx + bw / 2, by - bh); ctx.lineTo(bx + bw * 0.38, by); ctx.lineTo(bx - bw * 0.38, by); ctx.fill();
  ctx.strokeStyle = '#9aa1ad'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(bx, by - bh, bw * 0.5, Math.PI, 0); ctx.stroke();

  // удочка: подсекает (lift) и гнётся, когда рыба на крючке (bend)
  let lift = 0, bend = 0.05;
  if (cur && now >= cur.tHook && now < cur.tBite) bend = isFat(cur.r) ? 0.25 + 0.08 * Math.sin(now / 80) : 0.15;
  if (cur && now >= cur.tBite) { const q = (now - cur.tBite) / P_OUT; lift = Math.sin(Math.PI * Math.min(1, q * 1.4)) * 0.3; bend = 0.12 * (1 - q); }
  if (fast) lift = 0.15 + 0.1 * Math.sin(now / 120);
  const ang = Math.atan2(g.tip[1] - g.grip[1], g.tip[0] - g.grip[0]) - lift, RL = Math.hypot(g.tip[0] - g.grip[0], g.tip[1] - g.grip[1]);
  const tip = [g.grip[0] + Math.cos(ang) * RL, g.grip[1] + Math.sin(ang) * RL];
  const butt = [g.grip[0] - Math.cos(ang) * S * 0.18, g.grip[1] - Math.sin(ang) * S * 0.18];
  const mid = [(g.grip[0] + tip[0]) / 2 - Math.sin(ang) * RL * bend, (g.grip[1] + tip[1]) / 2 + Math.cos(ang) * RL * bend];

  // леска и поплавок
  let end = null;
  if (cur && now >= cur.tBite) {
    const q = Math.min(1, (now - cur.tBite) / P_OUT), L = fishLen(g, cur.r);
    const to = [bx, by - bh - L * 0.3];
    end = [lerp(hook[0], to[0], q), lerp(hook[1], to[1], q) - S * 1.0 * 4 * q * (1 - q)];
    ctx.strokeStyle = 'rgba(220, 230, 240, 0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(...tip); ctx.lineTo(...end); ctx.stroke();
    if (q < 1) drawFish(end[0], end[1] + L * 0.4, L, 1, fishColor(cur.r), Math.sin(now / 50) * L * 0.15, -Math.PI / 2);
  } else {
    const dip = fighting ? S * 0.06 + Math.sin(now / 60) * S * 0.03 : Math.sin(now / 500) * 1.2;
    const fy = flt[1] + dip;
    ctx.strokeStyle = 'rgba(220, 230, 240, 0.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(...tip); ctx.lineTo(flt[0], fy); ctx.lineTo(hook[0], hook[1]); ctx.stroke();
    ctx.fillStyle = '#e05252'; ctx.beginPath(); ctx.ellipse(flt[0], fy - S * 0.03, S * 0.035, S * 0.05, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e8eaf0'; ctx.beginPath(); ctx.ellipse(flt[0], fy + S * 0.02, S * 0.035, S * 0.03, 0, 0, 7); ctx.fill();
    if (fighting) {   // круги по воде
      for (let i = 0; i < 2; i++) {
        const q = ((now - cur.tHook) / 600 + i * 0.5) % 1;
        ctx.strokeStyle = `rgba(160, 200, 240, ${0.6 * (1 - q)})`;
        ctx.beginPath(); ctx.ellipse(flt[0], sy, S * 0.1 + q * S * 0.4, (S * 0.1 + q * S * 0.4) * 0.25, 0, 0, 7); ctx.stroke();
      }
    }
  }

  // рыбак
  const grip = g.grip;
  walker(g.mx, deck, S, { dir: 1, bob: Math.sin(now / 900) * S * 0.006,
    hands: () => [[grip[0] - g.mx, grip[1] - deck], [grip[0] - g.mx + Math.cos(ang) * S * 0.1, grip[1] - deck + Math.sin(ang) * S * 0.1]] });
  ctx.strokeStyle = '#c9ced8'; ctx.lineWidth = Math.max(1.5, S * 0.03); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(...butt); ctx.lineTo(...grip); ctx.quadraticCurveTo(...mid, ...tip); ctx.stroke();

  // «уйти пораньше»: рыбы сами выпрыгивают в ведро
  for (const j of pond.jumps) {
    const q = (now - j.t0) / P_JUMP; if (q < 0) continue;
    const s = wander(g, j.r, j.t0), L = fishLen(g, j.r);
    drawFish(lerp(s.x, bx, q), lerp(s.y, by - bh, q) - S * 1.2 * 4 * q * (1 - q), L, s.x > bx ? -1 : 1, fishColor(j.r), Math.sin(now / 40) * L * 0.15, (q - 0.5) * 2);
  }
}

function lifeGeometry() {

  const hw = Math.min(S * 1.1, W * 0.24), hx = Math.max(10, W * 0.06);
  return { W, H, S, gy, hw, hx, tx: hx + hw + S * 0.45, cx: W * 0.6, hay: W - Math.max(S * 0.55, W * 0.08) };
}

function drawHouse(g) {
  const { hx, hw, gy } = g, hh = hw * 0.7;
  ctx.fillStyle = '#5a3a22'; ctx.fillRect(hx, gy - hh, hw, hh);
  ctx.fillStyle = '#8a3b2e'; ctx.beginPath(); ctx.moveTo(hx - hw * 0.1, gy - hh); ctx.lineTo(hx + hw / 2, gy - hh - hw * 0.45); ctx.lineTo(hx + hw * 1.1, gy - hh); ctx.fill();
  ctx.fillStyle = '#ffd36b'; ctx.fillRect(hx + hw * 0.58, gy - hh * 0.75, hw * 0.25, hw * 0.22);
  ctx.fillStyle = '#3a2516'; ctx.fillRect(hx + hw * 0.15, gy - hh * 0.62, hw * 0.24, hh * 0.62);
}

// season: -1 обычное лето при жизни, 0 осень, 1 зима, 2 весна, 3 лето; sp — доля сезона
function drawTree(g, a, season, sp, now) {
  const { tx, gy, S } = g, h = S * (0.35 + 1.25 * Math.min(1, (a - 33) / 30));
  ctx.strokeStyle = '#6e4526'; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(2, h * 0.07); ctx.beginPath(); ctx.moveTo(tx, gy); ctx.lineTo(tx, gy - h * 0.55); ctx.stroke();
  ctx.lineWidth = Math.max(1.5, h * 0.03); ctx.beginPath();
  for (const [dx, dy] of [[-0.25, -0.85], [0.22, -0.8], [0, -0.95], [-0.15, -0.65], [0.18, -0.62]]) { ctx.moveTo(tx, gy - h * 0.5); ctx.lineTo(tx + dx * h, gy + dy * h); }
  ctx.stroke();
  const crown = (col, alpha) => {
    ctx.globalAlpha = alpha; ctx.fillStyle = col;
    for (const [dx, dy, r] of [[0, -0.75, 0.3], [-0.2, -0.65, 0.22], [0.2, -0.66, 0.22], [0, -0.92, 0.2]]) { ctx.beginPath(); ctx.arc(tx + dx * h, gy + dy * h, r * h, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1;
  };
  if (season === 0) crown('#d9822b', 1 - sp * 0.85);
  else if (season === 1) { ctx.fillStyle = '#e8eaf0'; for (const dx of [-0.2, 0, 0.18]) ctx.fillRect(tx + dx * h - h * 0.06, gy - h * 0.82 - (dx ? 0 : h * 0.1), h * 0.12, Math.max(2, h * 0.025)); }
  else if (season === 2) { crown('#7fcf6a', Math.min(1, sp * 1.5)); ctx.fillStyle = '#ffb3c7'; const r = rng(5); for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(tx + (r() - 0.5) * h * 0.6, gy - h * (0.55 + r() * 0.45), Math.max(1.5, h * 0.03), 0, 7); ctx.fill(); } }
  else crown('#3f8f4a', 1);
}

function lifeFrame(now) {
  const g = life.geo; if (!g) return;

  const a = Math.max(0, Math.min(100, curPct)), y = Math.floor(a), dead = a >= 95;

  ctx.fillStyle = season === 1 ? `rgba(232, 234, 240, ${0.3 + sp * 0.5})` : '#24402a';

  if (y >= 26) drawHouse(g);

      if (season === 0) { ctx.save(); ctx.translate(x, yy); ctx.rotate(now / 500 + i); ctx.fillStyle = ['#d9822b', '#e0b13c', '#b5532e'][i % 3]; ctx.beginPath(); ctx.ellipse(0, 0, 5, 2.5, 0, 0, 7); ctx.fill(); ctx.restore(); }
      else if (season === 1) { ctx.fillStyle = '#e8eaf0'; ctx.beginPath(); ctx.arc(x, yy, 1.5 + (i % 3) * 0.6, 0, 7); ctx.fill(); }
      else if (season === 3) { ctx.strokeStyle = 'rgba(143, 192, 255, 0.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x, yy); ctx.lineTo(x - 2, yy + 9); ctx.stroke(); }
      else if (i < 12) { ctx.fillStyle = '#ffb3c7'; ctx.beginPath(); ctx.arc(x + Math.sin(now / 400 + i) * 20, yy, 2, 0, 7); ctx.fill(); }
    }
  }

  // шкала жизни 0–100
  const x0 = 16, x1 = W - 16, ly = H - 20, X = v => lerp(x0, x1, v / 100);
  ctx.lineCap = 'round'; ctx.lineWidth = 4;
  ctx.strokeStyle = '#262a34'; ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(x1, ly); ctx.stroke();
  ctx.strokeStyle = '#4f9cff'; ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(X(Math.min(a, 95)), ly); ctx.stroke();
  if (a > 95) { ctx.strokeStyle = '#6b6f7a'; ctx.beginPath(); ctx.moveTo(X(95), ly); ctx.lineTo(X(a), ly); ctx.stroke(); }
  ctx.fillStyle = '#8a90a0'; ctx.font = '10px -apple-system, sans-serif'; ctx.textAlign = 'center';
  for (let v = 0; v <= 100; v += W < 500 ? 20 : 10) ctx.fillText(v, X(v), ly + 14);
  ctx.fillText('†', X(95), ly - 7);
  ctx.fillStyle = dead ? '#8a90a0' : '#e8eaf0'; ctx.beginPath(); ctx.arc(X(a), ly, 5, 0, 7); ctx.fill();
}

function drawBatrak(g, a, y, now) {
  const { S, gy, cx } = g, s = S * (0.3 + 0.7 * Math.min(1, a / 18)), t = now / 1000;
  if (y < 1) {   // младенец в люльке

  // наш поезд «Россия»: красный локомотив и серо-красные вагоны
  car(headU, tA, carL * 0.85, '#c8352e', '#8e2620', true);
  ctx.fillStyle = '#ffe9a8'; ctx.beginPath(); ctx.arc(headU - 2, tA - cw * 0.28, 1.6, 0, 7); ctx.arc(headU - 2, tA + cw * 0.28, 1.6, 0, 7); ctx.fill();
  for (let i = 0, u = headU - carL * 0.85 - 3; i < 16 && u > -carL; i++, u -= carL + 3) {
    car(u, tA, carL, '#8d96a6', '#6d7686');
    ctx.fillStyle = '#c8352e'; ctx.fillRect(u - carL, tA - cw / 2, carL, 2); ctx.fillRect(u - carL, tA + cw / 2 - 2, carL, 2);
    ctx.fillStyle = '#5a616e'; for (let j = 1; j < 4; j++) ctx.fillRect(u - carL + carL * j / 4 - 2, tA - 2, 4, 4);   // вентиляция
  }
  ctx.restore();

  // подписи (без поворота, чтобы читались)
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const [u, v, text, size] of labels) {
    if (u < 10 || u > VL - 10) continue;
    const [x, y] = toScreen(u, v);
    if (y > H - strip - 8) continue;
    ctx.font = size < 0 ? 'italic 11px -apple-system, sans-serif' : `600 ${size === 2 ? 13 : 11}px -apple-system, sans-serif`;
    const w = ctx.measureText(text).width + 10;
    const lx = Math.max(w / 2 + 2, Math.min(W - w / 2 - 2, x)), ly = Math.max(10, Math.min(H - strip - 10, y));
    ctx.fillStyle = size < 0 ? 'rgba(15, 30, 45, 0.75)' : 'rgba(15, 17, 21, 0.8)'; ctx.beginPath(); ctx.roundRect(lx - w / 2, ly - 9, w, 18, 5); ctx.fill();
    ctx.fillStyle = size < 0 ? '#8fc0ff' : '#e8eaf0'; ctx.fillText(text, lx, ly);
  }

  // маршрут целиком внизу
  ctx.fillStyle = 'rgba(15, 17, 21, 0.88)'; ctx.fillRect(0, H - strip, W, strip);
  const x0 = 16, x1 = W - 16, ly = H - 26, X = k => lerp(x0, x1, k / TOTAL_KM);
  ctx.lineCap = 'round'; ctx.lineWidth = 3;
  ctx.strokeStyle = '#262a34'; ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(x1, ly); ctx.stroke();
  ctx.strokeStyle = '#4f9cff'; ctx.beginPath(); ctx.moveTo(x0, ly); ctx.lineTo(X(km), ly); ctx.stroke();
  ctx.font = '10px -apple-system, sans-serif'; ctx.textBaseline = 'alphabetic';
  let lastLabel = -1e9;
  STATIONS.forEach((s, i) => {
    const x = X(s[1]), passed = s[1] <= km;
    ctx.fillStyle = passed ? '#4f9cff' : '#5a6070'; ctx.beginPath(); ctx.arc(x, ly, s[3] === 2 ? 3 : 1.6, 0, 7); ctx.fill();
    const big = s[3] === 2 && (W >= 600 || i === 0 || i === STATIONS.length - 1);
    if (big && x - lastLabel > 70) {
      ctx.fillStyle = '#8a90a0'; ctx.textAlign = i === 0 ? 'left' : i === STATIONS.length - 1 ? 'right' : 'center';
      ctx.fillText(s[0], i === 0 ? x0 - 4 : i === STATIONS.length - 1 ? x1 + 4 : x, ly + 15); lastLabel = x;
    }
  });
  ctx.fillStyle = '#c8352e'; ctx.beginPath(); ctx.roundRect(X(km) - 6, ly - 4, 12, 8, 3); ctx.fill();
}

// ===== Переключатель сцен =====
let curK = -1, curPct = 0;
const SCENES = [
  { name: 'Стрелок', words: ['выстрел', 'каждые', 'следующий выстрел', 'следующий'], set: drawCrowd, frame: crowdFrame },
  { name: 'Костёр',  words: ['полено', 'каждые', 'следующее полено', 'следующее'], set: fireSet, frame: fireFrame },
  { name: 'Рыбалка', words: ['поклёвка', 'каждые', 'следующая поклёвка', 'следующая'], set: pondSet, frame: pondFrame },
  { name: 'Батрак',  words: ['год', 'каждые', 'следующий год', 'следующий'], set: lifeSet, frame: lifeFrame, steps: 100 },
  { name: 'Поезд', set: trainSet, frame: trainFrame, sub: (left, f) => {
      const km = curPct / 100 * TOTAL_KM, nx = nextStation(km);
      if (km >= TOTAL_KM - 0.5) return 'Приехали во Владивосток!';
      const t = (nx[1] - km) / TOTAL_KM * dayLenMs();
      return nx[0] + ' через <b>' + (t >= 3600000 ? fmt(t) : f(t)) + '</b>';
    } },
];
let active = Math.min(SCENES.length - 1, Math.max(0, state.scene | 0));
$('dots').innerHTML = SCENES.map((s, i) => `<button aria-label="${s.name}" data-i="${i}"></button>`).join('');
function goTo(i, smooth) {
  i = (i + SCENES.length) % SCENES.length;
  area.scrollTo({ left: i * area.clientWidth, behavior: smooth ? 'smooth' : 'auto' });
  if (!smooth) activate(i);
}
function activate(i) {
  active = i; state.scene = i; save();
  $('sceneName').textContent = SCENES[i].name;
  [...$('dots').children].forEach((d, j) => d.classList.toggle('on', j === i));
  if (curK >= 0) render();
}
area.addEventListener('scroll', () => {
  const i = Math.round(area.scrollLeft / (area.clientWidth || 1));
  if (i !== active && i >= 0 && i < SCENES.length) activate(i);
}, { passive: true });
$('prev').onclick = () => goTo(active - 1, true);
$('next').onclick = () => goTo(active + 1, true);
$('dots').onclick = e => { if (e.target.dataset.i) goTo(+e.target.dataset.i, true); };
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft') goTo(active - 1, true);
  if (e.key === 'ArrowRight') goTo(active + 1, true);
});

// Рисуем только те сцены, что видны (во время свайпа — две соседние)
function loop(now) {
  requestAnimationFrame(loop);
  const x = area.scrollLeft / (area.clientWidth || 1);
  for (let i = Math.floor(x); i <= Math.ceil(x); i++) if (SCENES[i]) SCENES[i].frame(now);
}
new ResizeObserver(() => {
  SCENES.forEach(s => s.set(Math.max(0, curK), true));
  area.scrollLeft = active * area.clientWidth;
}).observe(area);

const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
const dayLenMs = () => Math.max(1, (toMin(state.end) - toMin(state.start)) * 60000);
const fmt = ms => {
  const t = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return [h, m, s].map(n => String(n).padStart(2, '0')).join(':');
};

// «Уйти пораньше»: оставшееся время быстро утекает до нуля
let fast = null;
function leftMs() {
  if (fast) return fast.from * (1 - Math.min(1, (Date.now() - fast.t0) / fast.dur));
  const now = new Date();
  const end = new Date(now); const [h, m] = state.end.split(':').map(Number);
  end.setHours(h, m, 0, 0);
  return Math.min(dayLenMs(), Math.max(0, end - now));
}

function render() {
  const left = leftMs();
  const pct = Math.min(100, Math.max(0, (1 - left / dayLenMs()) * 100));
  $('timer').textContent = fmt(left);
  $('percent').textContent = pct.toFixed(2) + '%';
  curK = Math.floor(pct * N / 100 + 1e-9); curPct = pct;
  updateBio(); updateTrain();
  SCENES.forEach(sc => sc.set(curK));
  const w = SCENES[active].words;
  // 1% дня в минутах и секундах + сколько до следующего процента
  const onePct = dayLenMs() / 100, oneShot = dayLenMs() / (SCENES[active].steps || N);
  const ms = t => { const x = Math.round(t / 1000); return Math.floor(x / 60) + ' мин ' + String(x % 60).padStart(2, '0') + ' сек'; };
  const toNext = left % oneShot || oneShot;
  const mmss = t => { const x = Math.round(t / 1000); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
  const sc = SCENES[active], short = innerWidth <= 700;
  if (sc.sub) $('percentSub').innerHTML = '1% = <b>' + (short ? mmss : ms)(onePct) + '</b>' + (pct < 100 ? '<br>' : ' · ') + sc.sub(left, short ? mmss : ms);
  else $('percentSub').innerHTML = short
    // на телефоне коротко
    ? '1% = <b>' + mmss(onePct) + '</b> · ' + w[0] + ' <b>' + mmss(oneShot) + '</b>' + (pct < 100 ? '<br>' + w[3] + ' через <b>' + mmss(toNext) + '</b>' : '')
    : '1% = <b>' + ms(onePct) + '</b> · ' + w[0] + ' ' + w[1] + ' <b>' + ms(oneShot) + '</b>' +
      (pct < 100 ? '<br>' + w[2] + ' через <b>' + ms(toNext) + '</b>' : '');

  $('timerSub').textContent = fast ? (left === 0 ? 'Ушёл пораньше 😎' : 'сбегаем…')
    : left === 0 ? 'Рабочий день окончен 🎉' : 'до ' + state.end;
  document.title = Math.floor(pct) + '% · ' + fmt(left).slice(0, 5);
}

$('start').value = state.start; $('end').value = state.end;
$('start').onchange = e => { state.start = e.target.value; save(); render(); };
$('end').onchange = e => { state.end = e.target.value; save(); render(); };

$('leave').onclick = () => {
  if (fast) {
    // вернуться к работе: обычная скорость, человечки снова по реальному времени
    fast = null; T_BULLET = 260; T_FALL = 420; T_GAP = 700;
    crowd.shots = []; fire.tosses = []; pond.jumps = [];
    $('leave').textContent = 'Уйти пораньше 🏃';
  } else {
    const rest = Math.max(1, N - Math.max(0, curK));                 // сколько ещё стоит
    const per = Math.max(10, Math.min(400, 5000 / rest));    // мс на одного, вся очередь ≤ 5 сек
    T_GAP = per; T_BULLET = Math.min(260, Math.max(80, per * 2)); T_FALL = Math.min(420, Math.max(150, per * 4));
    fast = { from: leftMs(), t0: Date.now(), dur: rest * per };
    $('leave').textContent = 'Вернуться к работе 💼';
  }
  render();
};

goTo(active);
render();
setInterval(render, 100);
requestAnimationFrame(loop);
</script>
</body>
</html>
